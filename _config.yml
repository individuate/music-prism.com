# GitHub Pages serves this repo's tracked files from the root, so anything
# committed here is reachable on music-prism.com unless it is excluded. These
# files belong in version control but not on the public site.
#
# NOTE: this only takes effect while Jekyll processes the site. If a `.nojekyll`
# file is ever added, Pages serves every tracked file verbatim and these
# exclusions stop applying — revisit this then.
exclude:
  - CLAUDE.md
  - DESIGN.md
  - README.md
  - .impeccable/
